spring.application.name=intelliCar
spring.datasource.url=jdbc:postgresql://localhost:5432/intellicar
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
intellicar.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

intellicar.security.jwt.access-expiration=900000
intellicar.security.jwt.refresh-expiration=604800000

