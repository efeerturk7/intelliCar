spring.application.name=intelliCar

# ---------- Sırlar (.env) ----------

spring.config.import=optional:file:.env[.properties]

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- JWT ----------

intellicar.security.jwt.secret=${JWT_SECRET}
intellicar.security.jwt.access-expiration=900000
intellicar.security.jwt.refresh-expiration=604800000

# ---------- Redis / Cache ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
# Kafka kapalıyken istek 60 sn takılmasın (varsayılan max.block.ms=60000)
spring.kafka.producer.properties.max.block.ms=3000

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.efeerturk.intelliCar.event
