spring.application.name=intelliCar

# ---------- Sırlar (.env) ----------
# Proje kökündeki .env dosyasını okur (IntelliJ'den çalıştırırken gerekli; çalışma dizini proje kökü olmalı).
# Docker'da .env image'a girmez, değerler docker-compose.yaml'dan ortam değişkeni olarak gelir.
spring.config.import=optional:file:.env[.properties]

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# (hibernate.dialect satırı kaldırıldı: Hibernate dialect'i otomatik algılıyor, elle vermek uyarı üretir)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# View katmanında lazy yükleme ile gizli sorgu çalışmasın
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- JWT ----------
# Varsayılan değer YOK: JWT_SECRET tanımlı değilse uygulama açılmaz (güvensiz varsayılanla çalışmasın diye).
intellicar.security.jwt.secret=${JWT_SECRET}
intellicar.security.jwt.access-expiration=900000
intellicar.security.jwt.refresh-expiration=604800000

# ---------- Redis / Cache ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# NOT: RedisConfig.redisCacheManager bean'i TTL'i 10 dk olarak kendisi belirliyor,
# bu iki satır o bean varken etkisizdir. İstersen ileride silebilirsin.
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ---------- Spring AI (Google Gemini) ----------
# API anahtarı .env dosyasından gelir (GEMINI_API_KEY). Varsayılan YOK: tanımlı değilse uygulama açılmaz.
# Anahtarı https://aistudio.google.com/apikey adresinden ücretsiz alabilirsin.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.6-flash}
# Düşük sıcaklık = daha tutarlı, daha az "uydurma" cevap (fiyat/sıralama işleri için uygun)
spring.ai.google.genai.chat.temperature=0.2
# Gemini kota/hata verirse istek dakikalarca beklemesin: az deneme, kısa bekleme.
# (Spring AI sürümünde bu anahtarlar tanınmıyorsa zararsızdır, yok sayılır.)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=5s

# ---------- AI rate limit (kullanıcı başına, iki AI endpoint'i için ortak; 0 = o limiti kapat) ----------
intellicar.ai.rate-limit.enabled=true
intellicar.ai.rate-limit.per-minute=5
intellicar.ai.rate-limit.per-day=50

# ---------- E-posta (varsayılan: Mailpit, UI http://localhost:8025) ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
intellicar.notification.email.enabled=true
intellicar.notification.email.from=${MAIL_FROM:no-reply@intellicar.local}

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
# Kafka kapalıyken istek 60 sn takılmasın (varsayılan max.block.ms=60000)
spring.kafka.producer.properties.max.block.ms=3000

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.efeerturk.intelliCar.event

# ---------- Görsel yükleme ----------
# Dosyalar bu klasöre yazılır ve /uploads/** adresinden sunulur. Docker'da kalıcı bir volume'a bağlanır.
intellicar.upload.dir=${UPLOAD_DIR:uploads}
# Boşsa görsel adresi isteğin geldiği sunucudan üretilir. Ön yüz farklı bir adresten erişiyorsa doldur: https://api.ornek.com
intellicar.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:}
intellicar.upload.max-images-per-car=15
intellicar.upload.max-file-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
