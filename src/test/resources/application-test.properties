# Testler için ayarlar (@ActiveProfiles("test")). Veritabanı, Redis ve Kafka adresleri
# AbstractIntegrationTest içinde Testcontainers'tan gelir; .env dosyası gerekmez.

# Gerçek sır değil, sadece testler için (en az 32 bayt)
intellicar.security.jwt.secret=test-only-jwt-secret-test-only-jwt-secret-0123456789
# Gemini'ye hiç istek gitmez (AI servisleri testlerde mock'lanır), ama bean'ler anahtar ister.
spring.ai.google.genai.api-key=test-api-key

# AI rate limit testleri için küçük limit: dakikada 3 istek, günlük limit kapalı
intellicar.ai.rate-limit.per-minute=3
intellicar.ai.rate-limit.per-day=0

spring.jpa.show-sql=false
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
