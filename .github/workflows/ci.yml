name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Workflow'un repoya sadece okuma izni olsun
permissions:
  contents: read

# Aynı branch'e art arda push gelirse eski çalışmayı iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Windows'ta commit edilen mvnw'nin çalıştırma izni kaybolmuş olabilir
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Birim testleri + Testcontainers entegrasyon testleri.
      # ubuntu-latest üzerinde Docker hazır geldiği için PostgreSQL, Redis ve Kafka container'ları otomatik kalkar.
      # .env veya sır gerekmez: testler src/test/resources/application-test.properties kullanır.
      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-image:
    name: Build Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Sadece imajın derlenebildiğini doğrular, hiçbir yere yüklemez (push: false)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: intellicar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
