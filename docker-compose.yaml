# Sırlar proje kökündeki .env dosyasından okunur (Compose bunu otomatik yapar).
# .env yoksa: cp .env.example .env  ve değerleri doldur.

services:
  # 1. PostgreSQL Veritabanı
  postgres:
    image: postgres:15-alpine
    container_name: intellicar-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env içinde tanımlı olmalı}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env içinde tanımlı olmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intellicar-network
    healthcheck:
      # $$ = değişken compose'da değil, container içinde çözülsün
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Önbellek (Cache)
  redis:
    image: redis:7-alpine
    container_name: intellicar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - intellicar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Kafka (KRaft modu, Zookeeper yok)
  # İki listener var:
  #   - localhost:9092 -> bilgisayarında (IntelliJ'den) çalışan uygulama için
  #   - kafka:29092    -> docker içindeki backend container'ı için
  kafka:
    image: apache/kafka:latest
    container_name: intellicar-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - intellicar-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # 4. Mailpit: geliştirme için sahte SMTP sunucusu. Giden e-postaları yakalar, UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: intellicar-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - intellicar-network

  # 5. intelliCar Backend Servisi (Opsiyonel: İster terminalden, ister IntelliJ'den çalıştır)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellicar-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env içinde tanımlı olmalı}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY .env içinde tanımlı olmalı}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@intellicar.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - intellicar-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  intellicar-network:
    driver: bridge
